<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Guan</title>
    <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Peter Guan" />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<div id="nav-placeholder"></div>

<main class="main-content">
    <h1>Building Logic.<br>Designing Empathy.</h1>
    <p>
        I’m <span class="hero-name">Peter Guan</span>. A developer and researcher bridging the gap between
        <strong>Human-Computer Interaction</strong> and <strong>Web3</strong>.
    </p>

    <div class="action-links">
        <a href="/html/project.html" class="btn">View My Work</a>
        <a href="/html/about.html" class="btn btn-secondary">Read My Story &rarr;</a>
    </div>
</main>

<div id="footer-placeholder"></div>

<script>
    // 1. 加载导航栏
    fetch('/html/nav.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;

            // --- 导航栏加载完成后的逻辑 ---

            // A. 高亮当前页面
            const path = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                // 简单的包含匹配 (适配 /html/resume.html 和 /resume 等情况)
                if (link.getAttribute('href') === path || (path === '/' && link.getAttribute('href') === '/index.html')) {
                    link.classList.add('active');
                }
            });

            // B. 汉堡菜单逻辑 (Mobile Menu)
            const burger = document.querySelector('.hamburger');
            const nav = document.querySelector('.nav-links');
            const navItems = document.querySelectorAll('.nav-links li');

            if (burger) {
                burger.addEventListener('click', () => {
                    // 切换菜单显示
                    nav.classList.toggle('nav-active');
                    // 切换汉堡按钮动画 (变X)
                    burger.classList.toggle('toggle');

                    // 列表项动画 (依次滑入)
                    navItems.forEach((link, index) => {
                        if (link.style.transitionDelay) {
                            link.style.transitionDelay = '';
                        } else {
                            link.style.transitionDelay = `${index * 0.1 + 0.1}s`;
                        }
                    });
                });

                // 点击链接后自动收起菜单
                navItems.forEach(item => {
                    item.addEventListener('click', () => {
                        nav.classList.remove('nav-active');
                        burger.classList.remove('toggle');
                        navItems.forEach(link => link.style.transitionDelay = '');
                    });
                });
            }
        });

    // 2. 加载页脚
    fetch('/html/footer.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('footer-placeholder').innerHTML = data;
        });
</script>
</body>

</html>
